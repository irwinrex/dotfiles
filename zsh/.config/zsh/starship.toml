"$schema" = 'https://starship.rs/config-schema.json'

# =========================
# LAYOUT
# =========================

# LEFT prompt (single line)
format = "$os$username$hostname$directory$git_branch$git_status$status $character"

# RIGHT prompt (context / versions / infra)
right_format = "$kubernetes$custom$terraform$docker_context $golang$python$nodejs"

add_newline = false
command_timeout = 1000


# =========================
# CORE
# =========================

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[directory]
truncation_length = 4
style = "bold cyan"
read_only = " 󰌾"

[status]
disabled = false
format = '[$symbol]($style) '

[os]
disabled = false
style = "bold white"
format = '[$symbol]($style)'

[os.symbols]
AIX = " "
AlmaLinux = " "
Alpaquita = " "
Alpine = " "
ALTLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
Bazzite = " "
Bluefin = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = " "
Gentoo = " "
HardenedBSD = "󰞌 "
Hurd = " "
Illumos = " "
InstantOS = " "
Ios = "󰀷 "
Kali = " "
KDENeon = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = " "
OpenCloudOS = " "
openEuler = " "
openSUSE = " "
OracleLinux = "󰺡 "
PikaOS = " "
Pop = " "
Raspbian = " "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Redox = "󰀘 "
RockyLinux = " "
Solus = " "
SUSE = " "
Ubuntu = " "
Ultramarine = " "
Unknown = " "
Uos = " "
Void = " "
Windows = "󰍲 "
Zorin = " "


# =========================
# VCS (GIT)
# =========================

[git_branch]
symbol = " "
style = "bold 208"

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'


# =========================
# CLOUD / INFRA (RIGHT SIDE)
# =========================

[kubernetes]
disabled = false
symbol = "☸ "
style = "bold blue"
format = '[$symbol$context(\($namespace\))]($style) '

[[kubernetes.contexts]]
context_pattern = "gke_.*_(?P<cluster>[\\w-]+)"
context_alias = "gke-$cluster"

[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:.*:cluster/(?P<cluster>[\\w-]+)"
context_alias = "eks-$cluster"

[aws]
disabled = true
symbol = "󰸏 "
style = "bold orange"
format = '[$symbol$profile(\($region\))]($style) '

[custom.aws_profile]
description = "Active AWS profile"
symbol = "󰸏 "
style = "bold orange"
format = '[$symbol$output]($style) '
shell = "sh"
command = 'printf %s "${AWSU_PROFILE:-${AWS_VAULT:-${AWSUME_PROFILE:-${AWS_PROFILE:-${AWS_SSO_PROFILE:-default}}}}}"'
when = '[ -n "$AWSU_PROFILE$AWS_VAULT$AWSUME_PROFILE$AWS_PROFILE$AWS_SSO_PROFILE" ] || [ -f "$HOME/.aws/config" ] || [ -f "$HOME/.aws/credentials" ]'

[terraform]
symbol = "󱁢 "
style = "bold 105"
format = '[$symbol$workspace]($style) '

[docker_context]
symbol = " "
style = "bold blue"
format = '[$symbol$context]($style) '


# =========================
# LANGUAGES / ENVS (RIGHT)
# =========================

[golang]
symbol = "󰟓 "
style = "bold cyan"
format = '[$symbol$version]($style) '

[python]
symbol = " "
style = "bold yellow"
pyenv_prefix = "venv "
detect_extensions = ["py"]
detect_files = [
  "pyproject.toml",
  "requirements.txt",
  "Pipfile",
  "setup.py",
  ".python-version"
]
detect_folders = [".venv", "venv"]

format = '[$symbol$pyenv_prefix$version(\($virtualenv\))]($style) '

[nodejs]
symbol = "󰎙 "
style = "bold green"
format = '[$symbol$version]($style) '


# =========================
# DISABLED / CLEANUP
# =========================

[shell]
disabled = true

[cmd_duration]
min_time = 500
style = "bold yellow"
